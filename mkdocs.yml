  - meta
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  - git-revision-date-localized:
      enabled: !ENV [MKDOCS_GIT_DATES, true]
      type: date
      timezone: UTC
      locale: en
      enable_creation_date: true
      fallback_to_build_date: true
      strict: false
  - privacy:
      enabled: !ENV [MKDOCS_PRIVACY, false]
      links: true
      assets: false
  - social:
      enabled: !ENV [MKDOCS_SOCIAL_CARDS, false]
      cards_layout_options:
        logo: docs/assets/brand/logo.svg
        background_color: '#0f766e'
        color: '#ffffff'
  - advanced-seo:
      url_base: https://swimmwatch.github.io/cloakbrowser-mcp/
      use_canonical_url: false
      use_open_graph: true
      use_twitter_cards: true
      add_schema_org_json_ld: true
      og_type: website
      og_image: assets/brand/social-card.png
      og_locale: en_US
      twitter_card_type: summary_large_image
      support_document_dates: true
  - minify:
      minify_html: !ENV [MKDOCS_MINIFY_HTML, true]
      htmlmin_opts:
        remove_comments: true

nav:
  - Overview: index.md
  - User Guide:
      - Getting Started: getting-started.md
      - Docker: docker.md
      - Version Compatibility: version-compatibility.md
      - Configuration: configuration.md
      - GeoIP Proxy Matching: geoip-proxy-matching.md
      - Humanized Input Behavior: humanized-input-behavior.md
      - CLI Reference: generated/cli.md
      - Tools: tools.md
      - Security: security.md
      - FAQ: faq.md
      - Tags: tags.md
  - Project Internals:
      - Contributor Guide: contributor-guide.md
      - Development: development.md
      - Testing: testing.md
      - Architecture: architecture.md
      - Release: release.md
      - Contributing: contributing.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 3

