site_name: cloakbrowser-mcp
site_description: Playwright MCP bridge that runs upstream browser tools with CloakBrowser.
site_url: https://swimmwatch.github.io/cloakbrowser-mcp/
site_author: swimmwatch
repo_url: https://github.com/swimmwatch/cloakbrowser-mcp
repo_name: swimmwatch/cloakbrowser-mcp
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 swimmwatch
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    tag:
      default: material/tag
      user: material/account
      docker: fontawesome/brands/docker
      config: material/tune
      tools: material/tools
      security: material/shield-lock
      project: material/source-branch
      test: material/test-tube
      api: material/api
      release: material/tag-check
      docs: material/file-document-multiple
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.tooltips
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - meta
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  - git-revision-date-localized:
      enabled: !ENV [MKDOCS_GIT_DATES, true]
      type: date
      timezone: UTC
      locale: en
      enable_creation_date: true
      fallback_to_build_date: true
      strict: false
  - privacy:
      enabled: !ENV [MKDOCS_PRIVACY, false]
      links: true
      assets: false
  - social:
      enabled: !ENV [MKDOCS_SOCIAL_CARDS, false]
      cards_layout_options:
        logo: docs/assets/brand/logo.svg
        background_color: '#0f766e'
        color: '#ffffff'
  - minify:
      minify_html: !ENV [MKDOCS_MINIFY_HTML, true]
      htmlmin_opts:
        remove_comments: true

nav:
  - Overview: index.md
  - User Guide:
      - Getting Started: getting-started.md
      - Docker: docker.md
      - Configuration: configuration.md
      - Tools: tools.md
      - Security: security.md
      - Tags: tags.md
  - Project Internals:
      - Contributor Guide: contributor-guide.md
      - Development: development.md
      - Testing: testing.md
      - Architecture: architecture.md
      - Release: release.md
      - Contributing: contributing.md
      - Roadmap: roadmap.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 3

extra:
  homepage: https://github.com/swimmwatch/cloakbrowser-mcp
  generator: false
  status:
    new: Recently added
  tags:
    User Guide: user
    Docker: docker
    Configuration: config
    Tools: tools
    Security: security
    Project Internals: project
    Testing: test
    API: api
    Release: release
    Documentation: docs
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/swimmwatch/cloakbrowser-mcp
      name: GitHub repository
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/cloakbrowser-mcp
      name: npm package
    - icon: fontawesome/brands/docker
      link: https://github.com/swimmwatch/cloakbrowser-mcp/pkgs/container/cloakbrowser-mcp
      name: GHCR image

extra_css:
  - assets/stylesheets/extra.css
