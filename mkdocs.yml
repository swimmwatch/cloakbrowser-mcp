site_name: CloakBrowser MCP
site_description: CloakBrowser MCP is a Playwright MCP bridge for Model Context Protocol browser automation with CloakBrowser, Docker, Streamable HTTP, GeoIP-aware proxy sessions, and humanized input behavior.
site_url: https://swimmwatch.github.io/cloakbrowser-mcp/
site_author: swimmwatch
repo_url: https://github.com/swimmwatch/cloakbrowser-mcp
repo_name: swimmwatch/cloakbrowser-mcp
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 swimmwatch
docs_dir: docs
site_dir: site
hooks:
  - docs/hooks/generate_cli_docs.py
exclude_docs: |
  dockerhub-readme.md
  hooks/
  overrides/
  requirements.txt
strict: true
theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    tag:
      default: material/tag
      user: material/account
      docker: fontawesome/brands/docker
      config: material/tune
      geoip: material/map-marker-radius
      humanize: material/gesture-tap
      proxy: material/lan-connect
      tools: material/tools
      security: material/shield-lock
      project: material/source-branch
      test: material/test-tube
      api: material/api
      release: material/tag-check
      docs: material/file-document-multiple
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.tooltips
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

