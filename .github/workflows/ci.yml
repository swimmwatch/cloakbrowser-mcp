name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_DOCKER_IMAGE: cloakbrowser-mcp:ci
  DOCKER_CACHE_SCOPE: cloakbrowser-mcp-docker
  NPM_VERSION: '11.19.0'
  NODE_CHECK_VERSIONS: '["22", "24", "25", "26"]'
  NODE_IMAGE_REF: node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
  PLAYWRIGHT_MCP_IMAGE: mcr.microsoft.com/playwright/mcp:v0.0.80@sha256:dda1f7f9b812e22946635c8af7df9288b96d3b9e3f0f1b8576d6823e2031c1de

jobs:
  node-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_versions: ${{ steps.versions.outputs.node_versions }}
      platforms: ${{ steps.versions.outputs.platforms }}
    steps:
      - id: versions
        run: |
          echo "node_versions=$NODE_CHECK_VERSIONS" >> "$GITHUB_OUTPUT"
          echo 'platforms=["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]' >> "$GITHUB_OUTPUT"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm run audit:prod

  quality:
    name: quality (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: node-versions
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.node-versions.outputs.platforms) }}
        node-version: ${{ fromJSON(needs.node-versions.outputs.node_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package:verify

  e2e:
    name: e2e (${{ matrix.os }}, node 26)
    needs: node-versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.node-versions.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Configure clean caches
        shell: node {0}
        run: |
          const { appendFileSync, mkdtempSync } = require('node:fs');
          const { join } = require('node:path');
          const environmentFile = process.env.GITHUB_ENV;
          const runnerTemp = process.env.RUNNER_TEMP;
          if (!environmentFile) throw new Error('GITHUB_ENV is required to configure Playwright caches.');
          if (!runnerTemp) throw new Error('RUNNER_TEMP is required to configure Playwright caches.');
          const cacheRoot = mkdtempSync(join(runnerTemp, 'cloakbrowser-playwright-console-'));
          appendFileSync(
            environmentFile,
            `NPM_CONFIG_CACHE=${join(cacheRoot, 'npm-cache')}\nPLAYWRIGHT_BROWSERS_PATH=${join(cacheRoot, 'ms-playwright')}\n`,
          );
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install chromium
      - run: npm run test:e2e

  cdp-e2e:
    name: managed CDP real-browser (linux/amd64, node 22)
    needs: node-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install chromium
      - run: npm run test:e2e:cdp
        env:
          CLOAKBROWSER_MCP_CDP_EXPECTED_ARCHITECTURE: linux/amd64

  coverage:
    runs-on: ubuntu-latest
    needs:
      - node-versions
      - quality
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.node-versions.outputs.node_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: vitest,node${{ matrix.node-version }}
          name: vitest-node${{ matrix.node-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm run docs:install
      - name: Install docs asset tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: npm run docs:assets
      - run: npm run docs:build
      - run: npm run docs:seo:validate

  docker:
    name: docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: quality
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
            image_tag: cloakbrowser-mcp:ci-linux-amd64
            runner: ubuntu-latest
            compare: true
          - platform: linux/arm64
            platform_slug: linux-arm64
            image_tag: cloakbrowser-mcp:ci-linux-arm64
            runner: ubuntu-24.04-arm
            compare: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - id: package
        name: Read package version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: base
        name: Resolve Playwright MCP base digest
        run: |
          digest="$(docker buildx imagetools inspect "$PLAYWRIGHT_MCP_IMAGE" | awk '/^Digest:/ { print $2; exit }')"
          if [ -z "$digest" ]; then
            echo "::error title=Base image digest not found::Could not resolve $PLAYWRIGHT_MCP_IMAGE"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.image_tag }}
          build-args: |
            NODE_IMAGE_REF=${{ env.NODE_IMAGE_REF }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            PLAYWRIGHT_MCP_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            RELEASE_VERSION=${{ steps.package.outputs.version }}
            RELEASE_VERSION_TAG=${{ steps.package.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}-${{ matrix.platform_slug }},ignore-error=true
      - name: Smoke (--help)
        run: docker run --rm "${{ matrix.image_tag }}" --help
      - name: Docker E2E acceptance
        run: npm run test:e2e:docker:run
        env:
          CLOAKBROWSER_MCP_DOCKER_IMAGE: ${{ matrix.image_tag }}
      - name: Managed CDP Docker acceptance (cloak)
        run: npm run test:e2e:cdp:docker:run
        env:
          CLOAKBROWSER_MCP_CDP_EXPECTED_ARCHITECTURE: ${{ matrix.platform }}
          CLOAKBROWSER_MCP_DOCKER_IMAGE: ${{ matrix.image_tag }}
      - name: Managed CDP Docker acceptance (playwright)
        run: npm run test:e2e:cdp:docker:run
        env:
          CLOAKBROWSER_MCP_CDP_DOCKER_ENGINE: playwright
          CLOAKBROWSER_MCP_CDP_EXPECTED_ARCHITECTURE: ${{ matrix.platform }}
          CLOAKBROWSER_MCP_DOCKER_IMAGE: ${{ matrix.image_tag }}
      - name: Compare with upstream Playwright MCP
        if: matrix.compare
        run: npm run bridge:compare -- "${{ matrix.image_tag }}" --report bridge-parity-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.compare
        with:
          name: bridge-parity-report-${{ matrix.platform_slug }}
          path: bridge-parity-report.json
          if-no-files-found: warn
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_tag }}
          version: v0.70.0
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-results-${{ matrix.platform_slug }}
          path: trivy-results.sarif
          if-no-files-found: warn
      - name: Upload Trivy SARIF
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif

  required-ci:
    name: required-ci
    if: ${{ always() }}
    needs:
      - npm-audit
      - quality
      - e2e
      - cdp-e2e
      - coverage
      - docs
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'EOF'
          const requiredJobs = ['npm-audit', 'quality', 'e2e', 'cdp-e2e', 'coverage', 'docs', 'docker'];
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failedJobs = requiredJobs
            .filter((jobName) => needs[jobName]?.result !== 'success')
            .map((jobName) => `${jobName}: ${needs[jobName]?.result ?? 'missing'}`);

          if (failedJobs.length > 0) {
            console.error(`Required CI jobs did not succeed: ${failedJobs.join(', ')}`);
            process.exit(1);
          }
          EOF
