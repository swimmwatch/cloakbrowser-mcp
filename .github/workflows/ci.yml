name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_DOCKER_IMAGE: cloakbrowser-mcp:ci
  DOCKER_CACHE_SCOPE: cloakbrowser-mcp-docker
  NODE_CHECK_VERSIONS: '["22", "23", "24", "25", "26"]'
  NODE_IMAGE_REF: node:22-bookworm-slim@sha256:7af03b14a13c8cdd38e45058fd957bf00a72bbe17feac43b1c15a689c029c732
  PLAYWRIGHT_MCP_IMAGE: mcr.microsoft.com/playwright/mcp:v0.0.76@sha256:3108dac789720d5236ee1869ad65c8f32fbbfe9d7eea8a5eb89920ab35a665d6

jobs:
  node-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_versions: ${{ steps.versions.outputs.node_versions }}
    steps:
      - id: versions
        run: echo "node_versions=$NODE_CHECK_VERSIONS" >> "$GITHUB_OUTPUT"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:prod

  quality:
    name: quality (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: node-versions
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ${{ fromJSON(needs.node-versions.outputs.node_versions) }}
        include:
          - os: ubuntu-24.04-arm
            node-version: 22
          - os: macos-latest
            node-version: 22
          - os: macos-15-intel
            node-version: 22
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package:verify

  coverage:
    runs-on: ubuntu-latest
    needs:
      - node-versions
      - quality
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.node-versions.outputs.node_versions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage/lcov.info
          flags: vitest,node${{ matrix.node-version }}
          name: vitest-node${{ matrix.node-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-node${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm run docs:install
      - name: Install docs asset tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: npm run docs:assets
      - run: npm run docs:build
      - run: npm run docs:seo:validate

  docker:
    name: docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
            image_tag: cloakbrowser-mcp:ci-linux-amd64
            compare: true
          - platform: linux/arm64
            platform_slug: linux-arm64
            image_tag: cloakbrowser-mcp:ci-linux-arm64
            compare: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: package
        name: Read package version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - id: base
        name: Resolve Playwright MCP base digest
        run: |
          digest="$(docker buildx imagetools inspect "$PLAYWRIGHT_MCP_IMAGE" | awk '/^Digest:/ { print $2; exit }')"
          if [ -z "$digest" ]; then
            echo "::error title=Base image digest not found::Could not resolve $PLAYWRIGHT_MCP_IMAGE"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          load: true
          pull: true
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.image_tag }}
          build-args: |
            NODE_IMAGE_REF=${{ env.NODE_IMAGE_REF }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            PLAYWRIGHT_MCP_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            RELEASE_VERSION=${{ steps.package.outputs.version }}
            RELEASE_VERSION_TAG=${{ steps.package.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true
      - name: Smoke (--help)
        run: docker run --rm --init "${{ matrix.image_tag }}" --help
      - name: Compare with upstream Playwright MCP
        if: matrix.compare
        run: npm run bridge:compare -- "${{ matrix.image_tag }}" --report bridge-parity-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && matrix.compare
        with:
          name: bridge-parity-report-${{ matrix.platform_slug }}
          path: bridge-parity-report.json
          if-no-files-found: warn
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_tag }}
          version: v0.70.0
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-results-${{ matrix.platform_slug }}
          path: trivy-results.sarif
          if-no-files-found: warn
      - name: Upload Trivy SARIF
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-results.sarif
