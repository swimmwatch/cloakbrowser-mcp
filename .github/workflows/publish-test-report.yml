name: Publish test report

# Same-repository CI calls its reviewed revision; fork notifications use default-branch code.
# Privileged handoff is intentional: publication code validates data,
# regenerates HTML, disables caches and obtains destination-only credentials afterward.
on: # zizmor: ignore[dangerous-triggers]
  workflow_call:
    secrets:
      TEST_REPORT_APP_PRIVATE_KEY:
        required: true
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '43 4 * * *'

permissions:
  contents: read

# Serialize destination writes and retention across PRs, reruns and scheduled cleanup.
concurrency:
  group: cloakbrowser-report-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.TEST_REPORT_PUBLICATION_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name != github.repository) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPORTS_REPOSITORY: ${{ vars.TEST_REPORT_REPOSITORY }}
      REPORT_INPUT: artifacts/publication-download
      REPORT_PUBLIC_TREE: artifacts/publication-tree
      REPORTS_CHECKOUT: artifacts/reports-checkout
      CLOAK_REPORT_PLATFORMS: '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]'
    steps:
      - name: Check out publication code from the trusted caller or default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule') && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - name: Read reporting Node version
        id: node-version
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const source = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          const match = /^ {2}NODE_PRIMARY_VERSION: '([0-9]+)'$/m.exec(source);
          if (!match) throw new Error('Missing reporting Node version in CI workflow');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\n`);
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate separate destination
        id: config
        run: node scripts/publish-test-report.mjs config
      - name: Resolve run and current PR through GitHub API
        id: identity
        if: github.event_name != 'schedule'
        run: node scripts/publish-test-report.mjs identity
      - name: Prepare isolated producer download directory
        if: steps.identity.outputs.eligible == 'true'
        run: mkdir -p "$REPORT_INPUT"
      - name: Download this API-verified run's producer data
        if: steps.identity.outputs.eligible == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.run-id }}
          pattern: test-results-*
          merge-multiple: false
          path: ${{ env.REPORT_INPUT }}
      - name: Validate, redact and regenerate public HTML using trusted tooling
        if: steps.identity.outputs.eligible == 'true'
        run: node scripts/publish-test-report.mjs prepare
      - name: Create short-lived reports-only installation credential
        if: github.event_name == 'schedule' || steps.identity.outputs.eligible == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TEST_REPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEST_REPORT_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository-name }}
          permission-contents: write
          permission-pages: read
      - name: Check out destination gh-pages for immutable-path and retention checks
        if: github.event_name == 'schedule' || steps.identity.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REPORTS_REPOSITORY }}
          ref: gh-pages
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          path: ${{ env.REPORTS_CHECKOUT }}
      - name: Preserve an already published immutable run
        id: stage
        if: steps.identity.outputs.eligible == 'true'
        run: node scripts/publish-test-report.mjs stage
      - name: Publish only trusted regenerated public tree
        if: steps.identity.outputs.eligible == 'true' && steps.stage.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ steps.app.outputs.token }}
          external_repository: ${{ env.REPORTS_REPOSITORY }}
          publish_branch: gh-pages
          publish_dir: ${{ env.REPORT_PUBLIC_TREE }}
          keep_files: true
          force_orphan: false
      - name: Verify Pages build and exact report URL before guarded comment
        if: steps.identity.outputs.eligible == 'true'
        run: node scripts/publish-test-report.mjs link
        env:
          REPORTS_TOKEN: ${{ steps.app.outputs.token }}
      - name: Expire only owned reports and replace exact expired comment pointers
        if: github.event_name == 'schedule'
        run: node scripts/publish-test-report.mjs cleanup
        env:
          REPORTS_TOKEN: ${{ steps.app.outputs.token }}
      - name: State unavailable publication with Actions fallback
        if: failure() && steps.identity.outputs.eligible == 'true'
        run: node scripts/publish-test-report.mjs unavailable
