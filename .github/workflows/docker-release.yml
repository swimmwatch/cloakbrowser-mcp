name: Docker Release

on:
  release:
    types: [published]

env:
  NODE_VERSION: '22'
  NODE_IMAGE_TAG: 22-bookworm-slim
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cloakbrowser-mcp
  IMAGE_TITLE: cloakbrowser-mcp
  IMAGE_DESCRIPTION: MCP server for CloakBrowser
  MCP_SERVER_NAME: io.github.swimmwatch/cloakbrowser-mcp
  DOCKER_PLATFORMS: linux/amd64
  DOCKER_CACHE_SCOPE: cloakbrowser-mcp-docker

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply release version from tag
        run: node scripts/apply-release-version.mjs "$GITHUB_REF_NAME"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=${{ env.MCP_SERVER_NAME }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true
          sbom: true
          provenance: mode=max
