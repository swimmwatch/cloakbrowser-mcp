name: Docker Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NODE_IMAGE_TAG: 22-bookworm-slim
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cloakbrowser-mcp
  IMAGE_TITLE: cloakbrowser-mcp
  IMAGE_DESCRIPTION: Playwright MCP bridge that runs upstream browser tools with CloakBrowser
  IMAGE_URL: https://swimmwatch.github.io/cloakbrowser-mcp/
  IMAGE_DOCUMENTATION: https://swimmwatch.github.io/cloakbrowser-mcp/
  IMAGE_AUTHORS: swimmwatch
  IMAGE_VENDOR: swimmwatch
  IMAGE_LICENSES: MIT
  MCP_SERVER_NAME: io.github.swimmwatch/cloakbrowser-mcp
  DOCKER_PLATFORMS: linux/amd64
  DOCKER_CACHE_SCOPE: cloakbrowser-mcp-docker
  PLAYWRIGHT_MCP_IMAGE: mcr.microsoft.com/playwright/mcp:v0.0.75

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: docker-production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - id: release
        name: Apply release version from tag
        run: node scripts/apply-release-version.mjs "$GITHUB_REF_NAME"

      - name: Run release checks
        run: npm run check:ci

      - name: Export release image names
        run: echo "RELEASE_SMOKE_IMAGE=${IMAGE_NAME}:${{ steps.release.outputs.docker_tag }}-smoke" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - id: base
        name: Resolve Playwright MCP base digest
        run: |
          digest="$(docker buildx imagetools inspect "$PLAYWRIGHT_MCP_IMAGE" | awk '/^Digest:/ { print $2; exit }')"
          if [ -z "$digest" ]; then
            echo "::error title=Base image digest not found::Could not resolve $PLAYWRIGHT_MCP_IMAGE"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.RELEASE_SMOKE_IMAGE }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            PLAYWRIGHT_MCP_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            RELEASE_VERSION_TAG=${{ steps.release.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true

      - name: Smoke release image
        run: docker run --rm --init "$RELEASE_SMOKE_IMAGE" --help

      - name: Compare release image with upstream Playwright MCP
        run: npm run bridge:compare -- "$RELEASE_SMOKE_IMAGE" --report bridge-parity-report.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bridge-parity-report-${{ steps.release.outputs.version_tag }}
          path: bridge-parity-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.RELEASE_SMOKE_IMAGE }}
          version: v0.70.0
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results-${{ steps.release.outputs.version_tag }}
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.docker_tag }}
            type=raw,value=${{ steps.release.outputs.docker_version }}
            type=raw,value=${{ steps.release.outputs.docker_major_minor }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.url=${{ env.IMAGE_URL }}
            org.opencontainers.image.documentation=${{ env.IMAGE_DOCUMENTATION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.ref.name=${{ steps.release.outputs.version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}
            org.opencontainers.image.authors=${{ env.IMAGE_AUTHORS }}
            org.opencontainers.image.vendor=${{ env.IMAGE_VENDOR }}
            org.opencontainers.image.base.name=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            io.modelcontextprotocol.server.name=${{ env.MCP_SERVER_NAME }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            PLAYWRIGHT_MCP_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            RELEASE_VERSION_TAG=${{ steps.release.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true
          sbom: true
          provenance: mode=max
