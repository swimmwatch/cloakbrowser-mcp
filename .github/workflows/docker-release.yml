name: Docker Release

on:
  release:
    types: [published]

env:
  NODE_VERSION: '22'
  NODE_IMAGE_TAG: 22-bookworm-slim
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cloakbrowser-mcp
  IMAGE_TITLE: cloakbrowser-mcp
  IMAGE_DESCRIPTION: Playwright MCP bridge that runs upstream browser tools with CloakBrowser
  MCP_SERVER_NAME: io.github.swimmwatch/cloakbrowser-mcp
  DOCKER_PLATFORMS: linux/amd64
  DOCKER_CACHE_SCOPE: cloakbrowser-mcp-docker
  PLAYWRIGHT_MCP_IMAGE: mcr.microsoft.com/playwright/mcp:v0.0.75

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - id: release
        name: Apply release version from tag
        run: node scripts/apply-release-version.mjs "$GITHUB_REF_NAME"

      - name: Run release checks
        run: npm run check:ci

      - name: Export release image names
        run: echo "RELEASE_SMOKE_IMAGE=${IMAGE_NAME}:${{ steps.release.outputs.docker_tag }}-smoke" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.RELEASE_SMOKE_IMAGE }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            RELEASE_VERSION_TAG=${{ steps.release.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true

      - name: Smoke release image
        run: docker run --rm "$RELEASE_SMOKE_IMAGE" --help

      - name: Compare release image with upstream Playwright MCP
        run: npm run bridge:compare -- "$RELEASE_SMOKE_IMAGE"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.docker_tag }}
            type=raw,value=${{ steps.release.outputs.docker_version }}
            type=raw,value=${{ steps.release.outputs.docker_major_minor }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.ref.name=${{ steps.release.outputs.version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=${{ env.MCP_SERVER_NAME }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            RELEASE_VERSION_TAG=${{ steps.release.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true
          sbom: true
          provenance: mode=max
