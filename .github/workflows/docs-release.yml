name: Docs Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION || secrets.BAIDU_SITE_VERIFICATION || '' }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION || secrets.BING_SITE_VERIFICATION || '' }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION || '' }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION || secrets.NAVER_SITE_VERIFICATION || '' }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION || secrets.YANDEX_SITE_VERIFICATION || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - id: release
        name: Apply release version from tag
        run: node scripts/apply-release-version.mjs "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r docs/requirements.txt

      - name: Install docs asset tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - run: npm run docs:assets

      - name: Write IndexNow key file
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: node scripts/write-indexnow-key.mjs

      - run: mkdocs build --strict

      - run: npm run docs:seo:validate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/submit-indexnow.mjs
