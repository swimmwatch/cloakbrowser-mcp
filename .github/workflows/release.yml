name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: Release tag to publish, for example v1.2.5.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.version_tag }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: '22'
  NPM_NODE_VERSION: '24'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NODE_IMAGE_TAG: 22-bookworm-slim
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cloakbrowser-mcp
  IMAGE_TITLE: cloakbrowser-mcp
  IMAGE_DESCRIPTION: Playwright MCP bridge that runs upstream browser tools with CloakBrowser
  IMAGE_URL: https://swimmwatch.github.io/cloakbrowser-mcp/
  IMAGE_DOCUMENTATION: https://swimmwatch.github.io/cloakbrowser-mcp/
  IMAGE_AUTHORS: swimmwatch
  IMAGE_VENDOR: swimmwatch
  IMAGE_LICENSES: MIT
  MCP_SERVER_NAME: io.github.swimmwatch/cloakbrowser-mcp
  DOCKER_PLATFORMS: linux/amd64
  DOCKER_CACHE_SCOPE: cloakbrowser-mcp-docker
  PLAYWRIGHT_MCP_IMAGE: mcr.microsoft.com/playwright/mcp:v0.0.75
  MCP_REGISTRY_API_URL: https://registry.modelcontextprotocol.io/v0.1

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docker_major_minor: ${{ steps.release.outputs.docker_major_minor }}
      docker_tag: ${{ steps.release.outputs.docker_tag }}
      docker_version: ${{ steps.release.outputs.docker_version }}
      is_prerelease: ${{ steps.release-mode.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.release-mode.outputs.npm_dist_tag }}
      version: ${{ steps.release.outputs.version }}
      version_tag: ${{ steps.release.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - id: release
        name: Apply release version from tag
        env:
          RELEASE_VERSION_TAG: ${{ github.event.release.tag_name || inputs.version_tag }}
        run: npm run version:apply -- "$RELEASE_VERSION_TAG"

      - id: release-mode
        name: Resolve release mode
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease || 'false' }}
        run: |
          set -euo pipefail
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  npm:
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 25
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NPM_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify dependency signatures
        run: npm audit signatures

      - id: release
        name: Apply release version from tag
        env:
          RELEASE_VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: npm run version:apply -- "$RELEASE_VERSION_TAG"

      - id: package
        name: Read package metadata
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure package version is not already published
        run: |
          package="${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "::error title=Package version already exists::$package is already published on npm"
            exit 1
          fi

      - name: Verify package metadata matches release tag
        run: |
          if [ "${{ steps.package.outputs.version }}" != "${{ needs.metadata.outputs.version }}" ]; then
            echo "::error title=Release version mismatch::package.json version ${{ steps.package.outputs.version }} does not match ${{ needs.metadata.outputs.version_tag }}"
            exit 1
          fi

      - run: npm run check:ci

      - id: pack
        name: Pack and verify npm tarball
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: npm run package:verify

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ needs.metadata.outputs.version_tag }}
          path: ${{ steps.pack.outputs.package_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish to npm
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: npm publish "${{ steps.pack.outputs.package_file }}" --access public --tag "${{ needs.metadata.outputs.npm_dist_tag }}"

  docker:
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 60
    environment: docker-production
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Apply release version from tag
        env:
          RELEASE_VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: npm run version:apply -- "$RELEASE_VERSION_TAG"

      - name: Run release checks
        run: npm run check:ci

      - name: Export release image names
        run: echo "RELEASE_SMOKE_IMAGE=${IMAGE_NAME}:${{ needs.metadata.outputs.docker_tag }}-smoke" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - id: base
        name: Resolve Playwright MCP base digest
        run: |
          digest="$(docker buildx imagetools inspect "$PLAYWRIGHT_MCP_IMAGE" | awk '/^Digest:/ { print $2; exit }')"
          if [ -z "$digest" ]; then
            echo "::error title=Base image digest not found::Could not resolve $PLAYWRIGHT_MCP_IMAGE"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.RELEASE_SMOKE_IMAGE }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            PLAYWRIGHT_MCP_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            RELEASE_VERSION=${{ needs.metadata.outputs.version }}
            RELEASE_VERSION_TAG=${{ needs.metadata.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true

      - name: Smoke release image
        run: docker run --rm --init "$RELEASE_SMOKE_IMAGE" --help

      - name: Compare release image with upstream Playwright MCP
        run: npm run bridge:compare -- "$RELEASE_SMOKE_IMAGE" --report bridge-parity-report.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bridge-parity-report-${{ needs.metadata.outputs.version_tag }}
          path: bridge-parity-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.RELEASE_SMOKE_IMAGE }}
          version: v0.70.0
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results-${{ needs.metadata.outputs.version_tag }}
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.docker_tag }}
            type=raw,value=${{ needs.metadata.outputs.docker_version }}
            type=raw,value=${{ needs.metadata.outputs.docker_major_minor }},enable=${{ needs.metadata.outputs.is_prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.is_prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.url=${{ env.IMAGE_URL }}
            org.opencontainers.image.documentation=${{ env.IMAGE_DOCUMENTATION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.ref.name=${{ needs.metadata.outputs.version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}
            org.opencontainers.image.authors=${{ env.IMAGE_AUTHORS }}
            org.opencontainers.image.vendor=${{ env.IMAGE_VENDOR }}
            org.opencontainers.image.base.name=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            io.modelcontextprotocol.server.name=${{ env.MCP_SERVER_NAME }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            PLAYWRIGHT_MCP_IMAGE=${{ env.PLAYWRIGHT_MCP_IMAGE }}
            PLAYWRIGHT_MCP_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            RELEASE_VERSION=${{ needs.metadata.outputs.version }}
            RELEASE_VERSION_TAG=${{ needs.metadata.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }},ignore-error=true
          sbom: true
          provenance: mode=max

  docs-build:
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION || secrets.BAIDU_SITE_VERIFICATION || '' }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION || secrets.BING_SITE_VERIFICATION || '' }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION || '' }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION || secrets.NAVER_SITE_VERIFICATION || '' }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION || secrets.YANDEX_SITE_VERIFICATION || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Apply release version from tag
        env:
          RELEASE_VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: npm run version:apply -- "$RELEASE_VERSION_TAG"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r docs/requirements.txt

      - name: Install docs asset tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - run: npm run docs:assets

      - name: Write IndexNow key file
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: node scripts/write-indexnow-key.mjs

      - run: mkdocs build --strict

      - run: npm run docs:seo:validate

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  docs-deploy:
    runs-on: ubuntu-latest
    needs: docs-build
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/submit-indexnow.mjs

  mcp-registry:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - npm
      - docker
    timeout-minutes: 45
    environment: mcp-registry-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Apply release version from tag
        env:
          RELEASE_VERSION_TAG: ${{ needs.metadata.outputs.version_tag }}
        run: npm run version:apply -- "$RELEASE_VERSION_TAG"

      - id: mcp-registry-publish
        name: Publish to MCP Registry
        uses: ./.github/actions/mcp-registry-publish
        with:
          server-json: server.json
          server-name: ${{ env.MCP_SERVER_NAME }}
          server-version: ${{ needs.metadata.outputs.version }}
          registry-api-url: ${{ env.MCP_REGISTRY_API_URL }}
          publisher-version: latest
          skip-existing: 'true'
