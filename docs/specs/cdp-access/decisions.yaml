  - category: cdp.proxy-protocol
    state: answered
    provenance: user
    question:
      text: 'Какой контракт должен иметь встроенный per-session CDP proxy? Рекомендую HTTP/WebSocket-aware reverse proxy: он обращается к внутреннему Chromium CDP с loopback Host, переписывает discovery webSocketDebuggerUrl на advertised endpoint и явно проверяет входные Host/Origin. Это обеспечивает работу через Docker/service hostname при актуальных ограничениях Chromium. Цена — proxy становится полноценной HTTP/WebSocket security boundary, поэтому потребуется больше кода и интеграционных тестов. Альтернатива — прозрачный TCP proxy, но тогда надёжно поддерживаются только IP/localhost адреса, а Docker hostname может быть отклонён Chromium.'
      kind: single_choice
      options:
        - id: http_ws_aware
          label: HTTP/WebSocket-aware proxy
        - id: transparent_tcp
          label: Transparent TCP proxy
    answer:
      text: Use a bridge-owned HTTP/WebSocket-aware reverse proxy for every CDP-enabled MCP session.
