  - category: cdp.configuration-contract
    state: answered
    provenance: user
    question:
      text: Как задать пул CDP-портов в публичной конфигурации? Рекомендую `--cdp-port-range <port|start-end>` и `CLOAK_PLAYWRIGHT_MCP_CDP_PORT_RANGE`, где одно число означает пул из одного порта; bind address задаётся отдельно через `--cdp-host` и `CLOAK_PLAYWRIGHT_MCP_CDP_HOST`. Незаданный диапазон отключает CDP. Цена — появляется формат диапазона, который нужно строго валидировать и документировать.
