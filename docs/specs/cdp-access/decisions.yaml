          {
            item_index: 53,
            item_key: requirement:CDP-014,
            verdict: covered,
            explanation: 'CDP-014 provides a bounded tiered matrix rather than a full Cartesian product and explicitly covers parsers, allocation, security, generation state, failures, real-browser sharing/isolation, engine/transport pairs, Docker, arm64 release evidence, and client teardown behavior.',
            requirement_ids: [CDP-014],
