  - category: cdp.host-origin-policy
    state: needs_user
    provenance: user
    question:
      text: 'Какую Host/Origin policy зафиксировать для CDP proxy? Рекомендую встроенную строгую policy без нового allowlist: принимать только Host текущего bind/advertised endpoint с закреплённым портом; WebSocket без Origin разрешать для небраузерных CDP-клиентов, а при наличии Origin требовать совпадения с разрешённой endpoint authority. К внутреннему Chromium proxy подключается с loopback Host и без Origin, поэтому `--remote-allow-origins=*` не нужен. Цена — hosted DevTools с отдельного web-origin потребует внешний same-origin reverse proxy и не поддерживается напрямую. Альтернатива — публичная configurable Origin allowlist, которая расширяет security surface и конфигурацию.'
      kind: single_choice
      options:
        - id: strict_derived
          label: Strict derived Host/Origin policy
        - id: configurable_allowlist
          label: Configurable Origin allowlist
    answer: null
