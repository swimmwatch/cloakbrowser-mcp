    question:
      text: Как выбирать порт внутри диапазона и обрабатывать занятые порты? Рекомендую проверять порты по возрастанию, закреплять первый реально доступный за CDP-enabled MCP-сессией до её закрытия и переходить к следующему при внешней коллизии. Если весь диапазон недоступен, инициализация только этой сессии завершается явной ошибкой без утечки session capacity; non-CDP-сессии продолжают работать. Цена — назначение конкретного порта не стабильно между перезапусками.
