  - category: cdp.lifecycle-ownership
    state: needs_user
    provenance: user
    question:
      text: 'Кто владеет временем жизни браузера при CDP-подключении? Рекомендую сохранить владельцем MCP-сессию: обычное отключение CDP-клиента не закрывает браузер, а отправка `Browser.close` считается неподдерживаемым разрушительным действием; после такого закрытия сессия завершается ошибкой и клиент создаёт новую MCP-сессию, без автоматического восстановления состояния. Цена — CDP-клиент должен использовать disconnect и не может рассчитывать на autorestart.'
      kind: single_choice
      options:
        - id: mcp_owns_no_restart
          label: MCP owns browser, no automatic restart
        - id: mcp_owns_restart
          label: MCP owns and automatically relaunches
        - id: cdp_may_close
          label: CDP client may own browser shutdown
    answer: null
    status: prepared
    context_reason: null
    requirement_ids: []
    id: 29e337a4-a02d-4cd7-88bd-8e7edd56b6d4
    revision: 1
