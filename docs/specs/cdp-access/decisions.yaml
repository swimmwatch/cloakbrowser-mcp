  - category: cdp.initialization-readiness
    state: answered
    provenance: user
    question:
      text: Когда CDP-enabled MCP-сессию считать успешно инициализированной? Рекомендую завершать `initialize` только после запуска браузера, доступности внутреннего loopback CDP, запуска внешнего session proxy и успешной проверки его `/json/version` с корректно переписанным `webSocketDebuggerUrl`. Это устраняет гонку, при которой `cloakbrowser_bridge_info` возвращает ещё неработающий endpoint. Цена — CDP-enabled initialization ждёт bounded readiness и завершается ошибкой при её таймауте. Альтернатива — вернуть initialize после резервирования порта, оставив клиенту retry.
      kind: single_choice
      options:
        - id: ready_before_initialize
          label: Wait for verified CDP readiness
        - id: eventual_readiness
          label: Return before CDP is ready
    answer:
      text: Complete a CDP-enabled MCP initialize only after bounded readiness verifies the browser loopback CDP and the session-owned external proxy, including a usable rewritten webSocketDebuggerUrl.
      selected_ids:
        - ready_before_initialize
    status: answered
    context_reason: null
