            explanation: 'The active security profile has no further material gap. CDP-001 identifies the privileged capability credential, defaults to disabled/loopback, requires explicit remote opt-in, validates hosts/schemes before allocation, uses at least 256 random bits and non-early-exit comparison, rotates credentials by session/generation, and warns about plaintext remote exposure. CDP-003 proves endpoint ownership and fails closed on substitution. CDP-005–CDP-006 enforce capability-first authentication, Host/Origin authorization, indistinguishable not-found responses, bounded redacted errors, and no unauthorized forwarding. CDP-009 invalidates credentials and sockets on loss/cleanup. CDP-013 defines sensitive-data prohibitions and bounded aggregate rejection audit signals. CDP-014 and CDP-015 require abuse-path evidence and operator safeguards. No long-term credential retention or privilege-elevation flow is introduced.',
