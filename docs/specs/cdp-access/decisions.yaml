  - category: cdp.http-default
    state: needs_user
    provenance: user
    question:
      text: 'How should the global CDP enabled setting interact with Streamable HTTP session metadata? The earlier confirmed source allows a global default, while the draft required every session to send `cdpEnabled: true`. Recommendation: keep the process default false; when the operator explicitly sets global CDP enabled, an HTTP session inherits that value if metadata is absent, while flat boolean `cdpEnabled: true` or `false` overrides it. Cost: after global opt-in, sessions consume CDP ports unless they explicitly opt out.'
      kind: single_choice
      options:
        - id: global_default_override
          label: Вернуть global default (Recommended)
