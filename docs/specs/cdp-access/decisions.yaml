            verdict: covered,
            explanation: 'CDP-013 quantifies connection, concurrency, header, response, message, queue, timeout, shutdown, and error-body limits; preserves stdout; defines redaction, backpressure, HTTP-session activity/expiry, and session-local failure effects.',
