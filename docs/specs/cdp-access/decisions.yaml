            explanation: 'The confirmed Deep scope is coherent with the specification: public configuration and metadata activate core; the HTTP/WebSocket proxy activates backend; leases, readiness, lifecycle, and diagnostics activate operations; privileged capability access activates security; shared MCP/CDP control activates cross-surface. UI, project-owned events, and stored-data migration remain absent, while quality scenarios and an architecture model are correctly reserved as planning artifacts.',
