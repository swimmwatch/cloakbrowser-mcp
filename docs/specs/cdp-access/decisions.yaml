  - id: scope.manifest
    category: scope
    state: needs_user
    provenance: user
    question:
      text: Confirm this exact scope proposal, or request a correction.
      kind: single_choice
      options:
        - id: confirm
          label: Confirm this proposal
        - id: change
          label: Change the proposal
    answer: null
    status: prepared
    scope:
      schema_version: 1
      depth: deep
      confirmed: false
      rationale:
        - Deep is warranted because the change evolves a public configuration and external protocol boundary, crosses Node and Docker deployments, and exposes a security-critical control interface.
        - The user confirmed support for both direct Node package execution and Docker.
        - Streamable HTTP creates independent browser runtimes per MCP session, so fixed-port behavior and session ownership require an explicit contract.
        - The external protocol remains Chromium CDP rather than a project-defined Playwright Server or OpenAPI contract, so no duplicate API schema is planned.
        - Measurable real-browser concurrency, isolation, failure, and security scenarios warrant a quality scenario artifact for planning.
      profiles:
        - id: core
          reason: Adds a public opt-in CLI and environment configuration contract that changes Chromium launch behavior.
          state: active
        - id: backend
          reason: Exposes Chromium's HTTP/WebSocket CDP endpoint to external clients and must define discovery, failure, and compatibility behavior.
          state: active
        - id: operations
          reason: Port allocation, bind address, Docker networking, per-session lifecycle, collisions, readiness, and diagnostics are material.
          state: active
        - id: security
          reason: CDP grants privileged unauthenticated browser control and can expose cookies, pages, and profile state outside MCP authentication.
          state: active
        - id: cross-surface
          reason: MCP and CDP clients concurrently control the same browser, context, pages, cookies, proxy, and fingerprint state.
          state: active
        - id: ui
          reason: No visual product interface or user interaction design is added.
          state: not_applicable
        - id: events
          reason: No project-owned asynchronous event contract is introduced; CDP events remain Chromium protocol behavior.
          state: not_applicable
        - id: data
          reason: No new stored schema or migration is introduced; existing browser profile data is only exposed through the selected browser session.
          state: not_applicable
      planning_artifacts:
        - quality/scenarios.yaml
    revision: 1
    supersedes_revision: null
    question_origin:
      id: scope.manifest
      revision: 1
