          {
            item_index: 48,
            item_key: requirement:CDP-009,
            verdict: gap,
            explanation: "CDP-009 defines generation invalidation and replacement readiness, but it does not define the downstream MCP result when an upstream browser tool succeeds (thereby creating the replacement browser) and the bridge's subsequent CDP identity/challenge/readiness verification fails. The sentence about forwarding an MCP tool failure unchanged covers an upstream failure, not this split outcome. Preserve the successful upstream tool result unchanged and keep CDP unavailable, or explicitly choose another behavior consistent with the no-tool-contract-rewrite invariant; add an acceptance case.",
            counterexample: 'After browser_close, browser_tabs succeeds and returns valid tabs from a newly launched browser, but the follow-up ownership challenge or /json/version probe times out. The specification says CDP remains unavailable but does not say whether the already-successful browser_tabs result is returned or replaced with a CDP readiness error.',
