          {
            item_index: 40,
            item_key: requirement:CDP-001,
            verdict: conflict,
            explanation: 'CDP-001 allows a wildcard bind host with remote opt-in and keeps advertisedHost optional. CDP-006 then rejects wildcard Host authorities and only accepts the bind or advertised authority. With 0.0.0.0 or :: and no advertisedHost, no concrete client Host can satisfy the policy, so a configuration accepted by CDP-001 produces an unusable managed endpoint. Require advertisedHost for wildcard binds (recommended), or explicitly define a safe set of concrete authorities and their canonicalization; add validation and tests.',
            counterexample: 'Configure --cdp-host 0.0.0.0 --cdp-allow-remote with a valid pool and no --cdp-advertised-host. Initialization may report a ready generation with discoveryUrl null, but Host: 192.0.2.10:<leased-port> is neither the wildcard bind authority nor an advertised authority and must be rejected.',
            requirement_ids: [CDP-001, CDP-006, CDP-008],
            source_refs:
              [
                { id: bd2a3820-723f-4b7e-9755-559277899067, revision: 4 },
                { id: e0b9f3dc-f02f-4cfb-b105-732f97127326, revision: 5 },
                { id: 4388e27a-a73f-41a4-bad6-2e282ad5c4ca, revision: 3 },
              ],
          },
          {
            item_index: 45,
            item_key: requirement:CDP-006,
            verdict: conflict,
            explanation: 'The capability-first and strict Host/Origin rules are otherwise complete, but the allowed-authority definition conflicts with the permitted wildcard-bind/no-advertised-host configuration. Because wildcard authorities are rejected and no concrete listener authority is derived, every real remote Host is rejected. Make advertisedHost mandatory for wildcard bind hosts, or define a bounded canonical concrete-authority derivation; specify case, IPv6 bracket, and port normalization in the same fix.',
            counterexample: 'For a proxy bound to :: with no advertisedHost, a client must send a concrete bracketed Host such as [2001:db8::10]:9222. CDP-006 accepts only the bind or advertised authority while explicitly rejecting wildcard authorities, so the request cannot be accepted.',
            requirement_ids: [CDP-001, CDP-006, CDP-008],
            source_refs:
              [
                { id: bd2a3820-723f-4b7e-9755-559277899067, revision: 4 },
                { id: 4388e27a-a73f-41a4-bad6-2e282ad5c4ca, revision: 3 },
                { id: e0b9f3dc-f02f-4cfb-b105-732f97127326, revision: 5 },
              ],
          },
          {
            item_index: 47,
            item_key: requirement:CDP-008,
            verdict: conflict,
            explanation: 'CDP-008 correctly models disabled, ready, and unavailable generations, but its wildcard rule permits a ready state with discoveryUrl null while CDP-006 leaves no acceptable concrete Host when advertisedHost is absent. This conflicts with the stated ready external endpoint. Require advertisedHost for wildcard binds or define a secure concrete authority; then state whether validation fails before admission rather than exposing an unusable ready state.',
            counterexample: 'With bindHost 0.0.0.0 and advertisedHost null, bridge_info can report enabled:true and state:ready but discoveryUrl:null. Any usable URL must contain a concrete host, and that Host is rejected by CDP-006, so ready does not mean externally usable.',
            requirement_ids: [CDP-001, CDP-006, CDP-008],
            source_refs:
              [
                { id: e0b9f3dc-f02f-4cfb-b105-732f97127326, revision: 5 },
                { id: 890eea02-6b14-41bb-a3c6-c60e08c50c3b, revision: 3 },
                { id: 4388e27a-a73f-41a4-bad6-2e282ad5c4ca, revision: 3 },
              ],
          },
          {
            item_index: 55,
            item_key: profile:core,
            verdict: conflict,
            explanation: 'The core profile is broadly covered, but its public configuration contract is internally inconsistent for wildcard bind hosts without advertisedHost: validation accepts the configuration while discovery and Host authorization cannot yield a usable endpoint. Make this combination invalid or define safe concrete authorities.',
            counterexample: A valid CLI configuration using 0.0.0.0 plus remote opt-in and no advertised host reaches a ready state but cannot produce an accepted concrete Host or discovery URL.,
            requirement_ids: [CDP-001, CDP-006, CDP-008],
            source_refs: [],
          },
          {
            item_index: 56,
            item_key: profile:backend,
            verdict: gap,
            explanation: "The backend profile covers proxy and generation mechanics, but the post-tool replacement failure boundary is incomplete. Specify the downstream result when the upstream browser tool succeeds yet the bridge's new-generation identity/challenge/readiness step fails; preserve the upstream result unchanged unless a separate explicit decision authorizes rewriting.",
            counterexample: "A replacement browser returns a successful browser_tabs result, then the bridge's CDP challenge fails. No rule decides whether the caller receives the successful tabs result or a bridge-generated CDP error.",
            requirement_ids: [CDP-007, CDP-008, CDP-009],
            source_refs: [],
          },
          {
            item_index: 57,
            item_key: profile:operations,
            verdict: conflict,
            explanation: 'Operational limits and cleanup are well specified, but an allowed wildcard/no-advertised-host deployment is operationally ready yet unusable, and the replacement-readiness failure result is undefined. Require advertisedHost for wildcard binds and define the split MCP/CDP failure outcome.',
            counterexample: 'An operator binds 0.0.0.0 with remote opt-in, sees state ready and a leased port, but every concrete Host is rejected; separately, a successful replacement tool call can be followed by an unspecified readiness failure.',
            requirement_ids: [CDP-001, CDP-006, CDP-008, CDP-009, CDP-013],
            source_refs: [],
          },
          {
            item_index: 58,
            item_key: profile:security,
            verdict: conflict,
            explanation: 'Capability secrecy, route restriction, Host/Origin checks, redaction and bounds cover the security profile, but strict authority validation contradicts the permitted wildcard/no-advertised-host configuration. Reject that combination before listener creation or define and test a secure concrete-authority allowlist.',
            counterexample: 'A wildcard listener has no wildcard Host it may accept and no advertised authority; accepting arbitrary interface Host would weaken the strict policy, while rejecting it makes the accepted configuration unusable.',
            requirement_ids: [CDP-001, CDP-005, CDP-006, CDP-008, CDP-013],
            source_refs: [],
          },
          {
            item_index: 59,
            item_key: profile:cross-surface,
            verdict: gap,
            explanation: "The cross-surface profile defines shared runtime state, generations, concurrent control, and diagnostics, but omits the observable MCP result when a successful upstream action creates a browser and the bridge's follow-up CDP readiness fails. State that MCP success remains success while CDP stays unavailable, or explicitly define another behavior.",
            counterexample: 'The MCP caller successfully opens or lists a page in the replacement browser, while the CDP caller remains unavailable because ownership verification failed; the specification does not define what the MCP caller receives.',
            requirement_ids: [CDP-002, CDP-008, CDP-009, CDP-010],
            source_refs: [],
          },
          {
            item_index: 60,
            item_key: context:specification,
            verdict: conflict,
            explanation: 'The specification is substantially complete and resolves the prior lifecycle, authentication, route, capacity, limit, and verification defects, but it is not yet internally consistent. First, wildcard bind without advertisedHost is accepted while strict Host policy makes it unusable. Second, the downstream MCP outcome after successful replacement tool execution plus failed CDP readiness is undefined. Fix both and rerun a fresh full review because source text will change.',
            counterexample: 'A wildcard-bound session can be marked ready without any accepted concrete Host, and a successful browser_tabs replacement call can be followed by failed CDP verification with no defined returned tool result.',
            requirement_ids:
              [
                CDP-001,
