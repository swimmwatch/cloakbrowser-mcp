  - category: cdp.advertised-port-mapping
    state: answered
    provenance: user
    question:
      text: Как публиковать CDP URL, если внешний порт может отличаться от выделенного proxy-порта? Рекомендую в первой версии менять только host через `--cdp-advertised-host` / `CLOAK_PLAYWRIGHT_MCP_CDP_ADVERTISED_HOST`, а порт в URL всегда брать из закреплённого session proxy; Docker/NAT должен использовать отображение порт-в-порт. Это сохраняет детерминированную связь session-to-port и не требует отдельной схемы сопоставления диапазонов. Цена — произвольное переназначение внешних портов не поддерживается автоматически. Альтернатива — добавить advertised port mapping, что расширит публичный контракт и усложнит многосессионную маршрутизацию.
      kind: single_choice
      options:
        - id: same_port
          label: Advertise same allocated port
        - id: port_mapping
          label: Support advertised port mapping
    answer:
      text: Advertise the session-owned external proxy port unchanged; Docker or NAT must map that port one-to-one. The optional advertised host changes only the host component.
      selected_ids:
        - same_port
    status: answered
    context_reason: null
    requirement_ids:
