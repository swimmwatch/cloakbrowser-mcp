    provenance: repository
    fact: Chrome 136 and later ignore remote-debugging-port and remote-debugging-pipe for the default Chrome data directory; remote debugging must use a non-default --user-data-dir.
    evidence:
      - https://developer.chrome.com/blog/remote-debugging-port
