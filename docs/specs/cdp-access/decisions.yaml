          {
            item_index: 54,
            item_key: requirement:CDP-015,
            verdict: covered,
            explanation: 'CDP-015 enumerates operator-facing configuration, initialize cost, per-session/generation lifecycle, security/TLS/capability handling, Docker mapping, resource limits, wildcard behavior, concurrency/destructive commands, tested teardown, protocol compatibility, examples, localization, and validation.',
