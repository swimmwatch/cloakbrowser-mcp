  - category: external.playwright
    state: observed
    provenance: repository
    fact: Playwright connectOverCDP accepts an HTTP discovery URL or a full browser WebSocket endpoint, exposes the existing default context, and has lower protocol fidelity than a Playwright protocol connection; closing the attached client disconnects it without killing the remote browser process.
    evidence:
      - https://github.com/microsoft/playwright/blob/v1.61.0/docs/src/api/class-browsertype.md
      - https://github.com/microsoft/playwright/blob/main/tests/library/chromium/connect-over-cdp.spec.ts
    question: null
    answer: null
    id: 614c4027-c9fc-42b1-bc2b-401316f986f9
    revision: 1
    supersedes_revision: null
  - category: external.open-webui
    state: observed
    provenance: repository
    fact: The current Open WebUI Playwright web loader uses chromium.connect(PLAYWRIGHT_WS_URL), which speaks the Playwright server protocol rather than connect_over_cdp; a raw CDP endpoint is therefore not directly compatible with that consumer.
    evidence:
      - https://github.com/open-webui/open-webui/blob/0a7c15832fb30b1903753e83f81dc7d27e5b0944/backend/open_webui/retrieval/web/utils.py
      - https://github.com/open-webui/open-webui/issues/27678
    question: null
    answer: null
    id: 9d265a14-7fef-453a-acd5-6f8e7ef8a8ad
    revision: 1
