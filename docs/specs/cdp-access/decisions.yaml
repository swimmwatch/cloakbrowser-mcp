            item_index: 65,
            item_key: profile:backend,
            verdict: gap,
            explanation: 'The active backend profile has no normative idempotency or ambiguous-failure rule for the supported mutating PUT /json/new operation. CDP-005 defines 502/504 envelopes and CDP-015 says documentation must identify safe retries, but the specification never establishes whether target creation may already have occurred or whether retry is safe after an upstream timeout or disconnect.',
