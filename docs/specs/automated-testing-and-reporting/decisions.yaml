    instruction:
      text: Expand automated testing in CloakBrowser MCP. Research architecture and existing unit/integration/E2E and CI; count the testing pyramid and distinguish mocks/fake upstream from real Chromium; map functional coverage, missing scenarios, duplicates and flakes. Specify prioritized test backlog and fast PR/heavy E2E/periodic strategy. Prefer Allure Report 3 with Vitest after current compatibility comparison. Report all levels with status, duration, errors, stack traces, retries/history, feature/environment grouping, screenshot/log attachments, local HTML viewing, GitHub Actions artifacts, parallel-job merge and Job Summary. Preserve Codecov and thresholds, upstream MCP contracts and architectural constraints; protect secrets; no unnecessary public report hosting. Implement prioritized missing real Chromium local-fixture tests with deterministic isolation/cleanup, reuse helpers; preserve cross-platform Node and Linux/macOS/Windows/Docker verification without heavy new required PR jobs. Update developer documentation. Validate typecheck, lint, unit/integration/E2E, coverage, report success/failure and npm run check; present final pyramid, matrix/gaps, tests, actual coverage and commands. Work autonomously beyond specification; no commits or PRs.
      source: 'User request in this chat, 2026-10-09: automated testing and reporting'
      kind: initial_request
