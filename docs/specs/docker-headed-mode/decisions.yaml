      text: 'Для HTTP фиксируем запуск Xvfb при первой headed-сессии и остановку после закрытия последней такой сессии, или оставляем его работать до завершения контейнера после первого запуска? Рекомендую первый вариант: проверка CloakBrowser показала, что headless работает без DISPLAY и Xvfb, а отдельные HTTP-сессии могут выбирать headed независимо от настройки процесса. В stdio headless Xvfb вообще не запускается. Цена первого варианта — координация одновременных сессий, ожидание готовности дисплея и дополнительные тесты запуска/остановки; второй проще, но сохраняет ненужный процесс после закрытия headed-сессий.'
      kind: single_choice
      options:
        - id: on_demand
          label: Останавливать после последней headed-сессии
        - id: keep_started
          label: Оставлять до завершения контейнера
    answer:
      text: Оставлять до завершения контейнера
      selected_ids:
        - keep_started
