  - category: behavior
    state: observed
    provenance: repository
    fact: On 2026-09-13 an isolated linux/amd64 probe against local image sha256:1bb03d275cd4d757cc8e8323a66658388f21164631cc0088c2869c0d381b0a65 launched the bundled CloakBrowser Chromium 146.0.7680.177 with Playwright 1.63.0-alpha-2026-08-31, headless:true, no DISPLAY or WAYLAND_DISPLAY and no Xvfb process. A data URL loaded and returned title headless-without-xvfb, then browser.close completed (exit 0). The S6 entrypoint was bypassed; this is evidence of browser headless independence, not acceptance of the future Tini launcher. Current config resolves options.headless before the process environment, and HTTP session metadata overrides only that session. Official Playwright CI documentation describes Xvfb for headed Linux execution.
    evidence:
      - src/bridge/config.ts:254
      - src/http/server.ts:369
      - Dockerfile
      - docs/specs/docker-headed-mode/spec.md
    question: null
    answer: null
