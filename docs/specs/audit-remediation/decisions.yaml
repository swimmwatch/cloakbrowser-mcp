    scope:
      schema_version: 1
      depth: deep
      confirmed: false
      rationale:
        - 'User explicitly selected one specification covering all 11 confirmed audit findings: SEC-001..003, CODE-001..007 and DOC-001, including necessary regression verification and documentation correction. No sibling specifications or implementation are authorized.'
        - Deep is warranted by high-impact HTTP authority/admission controls, proxy-secret exposure, cancellation propagation and concurrent resource ownership across CLI, MCP transports, upstream child processes and managed browser generations. Detail must preserve thin upstream-tool forwarding and session isolation.
        - 'Preserve existing component support: npm on Linux x64/arm64, macOS arm64/x64 and Windows x64; Node ^22.13.0 || >=24.0.0; Docker Linux amd64/arm64. Existing declared support is a contract, not a claim that the prior Linux audit dynamically validated every platform.'
        - Behavioral scope includes failures/recovery, profile/config/child cleanup, requested browser-channel selection, zero-page browser liveness, doctor accuracy and canonical/localized logging guidance. No new upstream browser tools or schema fork, dependency/runtime changes, release/publication, migration or speculative redesign.
        - Optional closed-session metadata retention and other unconfirmed/future risks are excluded as remediation targets. Source-only variants relevant to confirmed secret/channel/security defects remain explicit verification boundaries rather than invented reproductions. Changing/removing the four pre-existing user result JSON files is not authorized; their failed-check prerequisite remains visible pending a separate ownership decision.
        - Planning should produce a core CLI/configuration contract, an MCP transport/lifecycle contract that references rather than copies upstream tool schemas, and measurable security/lifecycle quality scenarios. This specification stage declares these artifacts only; it does not create plans, contracts, handoffs, code or commits.
      profiles:
        - id: core
          reason: CLI/configuration channel and precedence, doctor diagnostics, stdio behavior and public documentation compatibility are directly affected.
          state: active
        - id: backend
          reason: Streamable HTTP admission/session behavior and MCP request/cancellation forwarding to the upstream process require observable protocol/state contracts.
          state: active
        - id: operations
          reason: Startup/shutdown/EOF, provisional sessions, child/browser/config/profile ownership, capacity recovery and npm/Docker/platform acceptance are material.
          state: active
        - id: security
          reason: Host/Origin admission, synthetic-secret non-disclosure, authenticated/unauthenticated trust boundaries and fail-closed behavior are central confirmed defects.
          state: active
        - id: ui
          reason: No visual user interface or design change is requested.
          state: not_applicable
        - id: events
          reason: Existing MCP protocol notifications/cancellation are covered by the transport contract; no independent asynchronous event architecture or event schema is introduced.
          state: not_applicable
        - id: data
          reason: No new persisted-data schema, migration or retention policy is requested; existing profile/file ownership and preservation belong to core/operations/security.
          state: not_applicable
        - id: cross-surface
          reason: No UI-to-service or multi-product user journey is introduced; affected CLI/MCP/runtime boundaries are covered by core/backend/operations without a separate architecture-model artifact.
          state: not_applicable
      planning_artifacts:
        - core/contracts.yaml
        - contracts/mcp.md
        - quality/scenarios.yaml
