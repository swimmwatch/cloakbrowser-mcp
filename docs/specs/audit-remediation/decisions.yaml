  - category: http-security-compatibility
    state: needs_user
    provenance: user
    question:
      text: Какую политику HTTP-доступа закрепляем? Рекомендую сохранить локальный запуск без токена и существующую возможность аутентификации на доверенном reverse proxy, но всегда проверять Host и присутствующий Origin. Внешние адреса должны быть явно разрешены оператором; запросы без Origin от обычных MCP-клиентов допустимы при корректном Host. Например, localhost работает без новых настроек, а mcp.example.com требует явного разрешения. Альтернатива — дополнительно сделать bearer-токен самого моста обязательным при привязке не к loopback, что изменит совместимость текущих развёртываний.
      kind: single_choice
      options:
        - id: compatible-authority-validation
          label: Совместимость и строгая проверка (Recommended)
        - id: mandatory-remote-bearer
          label: Обязательный токен вне loopback
        - id: custom-http-policy
          label: Другая политика
