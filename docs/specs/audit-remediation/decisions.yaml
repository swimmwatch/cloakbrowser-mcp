          revision: 1
        question:
          text: 'Как фиксируем замечание о humanize и CloakBrowser 0.6.4? Сейчас проект использует 0.5.10, а согласованный объём исключал обновление зависимостей. Рекомендую включить в будущую реализацию переход существующей зависимости на точную проверенную версию 0.6.4 и подтверждение работоспособности humanize реальными проверками, без безусловного разрешения всех будущих patch-версий. Например, свежая установка должна выбирать уже проверенную 0.6.4, а не неожиданно получить неподдерживаемую 0.6.5. Сейчас мы только меняем спецификацию: пакеты, исходники и lockfile не изменяем.'
          kind: single_choice
          options:
            - id: target-exact-0-6-4
              label: Целевая 0.6.4 (Recommended)
            - id: defer-dependency-upgrade
              label: Без обновления зависимости
            - id: custom-version-policy
              label: Другой диапазон версий
        next: Ask the saved question with the callable host-native question tool.
