        question:
          text: 'Как применяем #179 к режиму managed CDP? Для обычных stdio/HTTP закрепим: занятый профиль не мешает запуску и получению списка инструментов; конфликт возвращается как ошибка первого вызова, которому нужен браузер. Но managed CDP сейчас запускает и проверяет браузер уже при инициализации, чтобы сразу предоставить готовый CDP-доступ. Рекомендую сохранить этот отдельный контракт, а не откладывать его незаметно. Например, второй обычный клиент сможет увидеть инструменты занятого профиля, но запрос на немедленно готовый managed CDP по-прежнему потребует свободный профиль.'
